version: 1

window_hours: 24
max_items_per_source: 100

sources:
  x:
    enabled: true
    mode: curated
    curated_accounts: []
    curated_lists: []
    credentials_env:
      bearer_token: X_BEARER_TOKEN

  techcrunch:
    enabled: true
    mode: rss
    rss_urls:
      - "https://techcrunch.com/feed/"

  ground_news:
    enabled: true
    mode: configured_feed_or_api
    endpoints: []
    credentials_env:
      api_key: GROUND_NEWS_API_KEY

classification:
  categories:
    - tech
    - startups
    - economy
    - politics

dedupe:
  exact_url: true
  title_similarity_threshold: 0.92
  semantic_dedupe:
    enabled: true
    provider: supermemory
    similarity_threshold: 0.87

ranking:
  top_overall: 10
  top_per_category: 3
  weights:
    recency: 0.30
    source_quality: 0.25
    category_fit: 0.20
    impact_signal: 0.25
